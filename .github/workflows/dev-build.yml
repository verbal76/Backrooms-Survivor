name: Dev build (OTA)

# RELEASE workflow: pushing to the `dev` branch builds Windows, Linux and Android from ONE pinned source SHA
# (build-all.yml), verifies every artifact, and only then publishes the rolling prerelease tagged `dev`:
#   - BackroomsSurvivor-windows-dev.zip   fresh-install Windows build (also what Steam Deck runs under Proton)
#   - BackroomsSurvivor-linux-dev.tar.gz  fresh-install native Linux x86_64 build (Steam Deck / SteamOS / desktop)
#   - BackroomsSurvivor-dev.apk           fresh-install Android build (debug-signed)
#   - patch.pck + manifest.json           what dev builds download at launch (OTA)
#   - release_manifest.json               build provenance: source SHA, versions, per-artifact sha256
# Dev builds check manifest.json on startup, verify patch.pck's SHA-256, load it, and run.
# Validation without publishing lives in validate-build.yml (same build-all.yml jobs).

on:
  push:
    branches: [dev]
    paths:
      - "godot/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-all.yml
    with:
      sha: ${{ github.sha }}
      mode: release
      source_ref: ${{ github.ref }}
      artifact_name: dev-release-files

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dev-release-files
          path: out

      - name: Publish rolling `dev` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ needs.build.outputs.sha }}"
          [ "$SHA" = "${{ github.sha }}" ] || { echo "::error::verified SHA $SHA != pushed ${{ github.sha }}"; exit 1; }
          grep -q "\"sha\": \"$SHA\"" out/release_manifest.json || { echo "::error::manifest does not carry $SHA"; exit 1; }
          ls -la out
          gh release delete dev --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create dev out/* --repo "${{ github.repository }}" \
            --target "$SHA" --prerelease \
            --title "Dev build ${{ github.run_number }}" \
            --notes "Rolling dev build ${{ github.run_number }} from source $SHA (all platforms identical source; see release_manifest.json). Dev builds update themselves from manifest.json; use the zip / tar.gz / apk for a fresh install (Linux: tar xzf, then ./BackroomsSurvivor.x86_64)."
