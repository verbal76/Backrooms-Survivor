name: Coordinated release build (manual)

# MANUAL, owner-initiated. Builds Windows + Linux + Android from ONE pinned source SHA with ONE build number,
# verifies every artifact, packages them with studio naming + checksums.sha256 + build-manifest.json, and (only when
# destination = github_releases) creates the immutable release tag `build-NN`.
# It NEVER touches the OTA channel (the rolling `dev` release / manifest.json); OTA is dev-build.yml's separate concern.
# Nothing here runs automatically. See docs/RELEASES.md.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: android, windows, linux or all. A github_releases destination requires all (a coordinated release never ships a missing platform).
        required: true
        type: choice
        options: [all, android, windows, linux]
        default: all
      source_sha:
        description: Full 40-char commit SHA to release (must be the current tip of dev)
        required: true
        type: string
      build_number:
        description: Coordinated build number NN (integer, greater than every existing build-NN tag and than the last OTA build)
        required: true
        type: string
      destination:
        description: local_only (workflow artifacts only, nothing published) or github_releases (creates the immutable release build-NN)
        required: true
        type: choice
        options: [local_only, github_releases]
        default: local_only

permissions:
  contents: read

env:
  # ONE definition of the private/public asset artifact name (build number + source SHA, both validated by the gate).
  RELEASE_ASSETS: coordinated-release-assets-b${{ inputs.build_number }}-${{ inputs.source_sha }}

concurrency:
  group: build-sequence
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Input rules
        env:
          PLAT: ${{ inputs.platform }}
          DEST: ${{ inputs.destination }}
        run: |
          python3 tools/platforms.py check "$PLAT"
          if [ "$DEST" = github_releases ] && [ "$PLAT" != all ]; then
            echo "::error::a GitHub release must contain all three platforms (platform=all)"; exit 1
          fi
      - name: Authorization, source and sequence gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SRC: ${{ inputs.source_sha }}
          NUM: ${{ inputs.build_number }}
        run: tools/publish_gate.sh

  build:
    needs: preflight
    uses: ./.github/workflows/build-all.yml
    with:
      sha: ${{ inputs.source_sha }}
      mode: release
      source_ref: refs/heads/dev
      artifact_name: coordinated-build-files
      build_number: ${{ inputs.build_number }}
      platform: ${{ inputs.platform }}
      retention_days: 14
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: coordinated-build-files
          path: out
      - name: Package with studio naming, checksums and manifest
        run: |
          [ "${{ needs.build.outputs.sha }}" = "${{ inputs.source_sha }}" ] || { echo "::error::verified SHA differs from requested"; exit 1; }
          python3 tools/package_release.py --in out --out release --build "${{ inputs.build_number }}" --platform "${{ inputs.platform }}"
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ASSETS }}
          path: release/*
          retention-days: 14

  publish:
    # Only when the owner chose destination = github_releases. Creates build-NN; never edits or replaces an existing release.
    if: ${{ inputs.destination == 'github_releases' }}
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run authorization, source and sequence gate (inside the publishing job)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SRC: ${{ inputs.source_sha }}
          NUM: ${{ inputs.build_number }}
        run: tools/publish_gate.sh
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ASSETS }}
          path: release
      - name: Create immutable release build-NN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NN=$(printf '%02d' "${{ inputs.build_number }}")
          gh release view "build-$NN" --repo "${{ github.repository }}" >/dev/null 2>&1 && { echo "::error::build-$NN already exists"; exit 1; }
          gh release create "build-$NN" release/* --repo "${{ github.repository }}" \
            --target "${{ inputs.source_sha }}" \
            --title "Backrooms Survivor Build $NN" \
            --notes "Coordinated build $NN from source ${{ inputs.source_sha }}: Android APK, Windows EXE zip and Linux tar.gz built from the same commit. Verify with checksums.sha256 and build-manifest.json. OTA is a separate channel and is not affected by this release."
